<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Salas de Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input [(ngModel)]="newRoomName" placeholder="Nombre de nueva sala"></ion-input>
    <ion-button (click)="onCreateRoom()" slot="end">Crear</ion-button>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let room of rooms" (click)="goToChat(room.id, room.name)" button>
      <ion-label>
        <h2>{{ room.name }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
