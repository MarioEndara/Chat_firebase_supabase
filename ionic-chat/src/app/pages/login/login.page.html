<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="display: flex; flex-direction: column; justify-content: center; height: 100%;">
    <h2 style="text-align: center;">Bienvenido al Chat</h2>
    
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="email" placeholder="ejemplo@correo.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="password" placeholder="******"></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="onLogin()">
      Entrar
    </ion-button>

    <ion-button expand="block" fill="clear" routerLink="/register">
      ¿No tienes cuenta? Regístrate
    </ion-button>
  </div>
</ion-content>
