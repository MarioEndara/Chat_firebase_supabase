<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ roomName }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let msg of messages">
      <ion-label>
        <p>{{ msg.user_id === currentUserId ? 'Tú' : 'Usuario' }}</p>
        <h2>{{ msg.content }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-item lines="none">
      <ion-input [(ngModel)]="newMessage" placeholder="Escribe un mensaje..." (keyup.enter)="sendMessage()"></ion-input>
      <ion-button (click)="sendMessage()" slot="end">Enviar</ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
